name: AliasMode 159 checks

# Throwaway: runs the patch guards and the stock-behaviour comparison against
# one engine build (BUILD_RUN). Lives only on this branch.
on:
  push:
    branches: [ci/aliasmode-159-checks]

env:
  BUILD_RUN: "46095265348"

permissions:
  contents: read
  actions: read

jobs:
  guards:
    name: Guards ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [spoofing, automation, parity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ci/requirements.txt && pip install -e python
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libasound2t64 libdbus-glib-1-2 libx11-xcb1 \
            libxcb-shm0 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 libxi6 libxrandr2 libxtst6 libpci3 zstd \
            xdotool x11-xkb-utils libegl1 libgles2 libgl1-mesa-dri
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: ./.github/actions/fpgen-model
      - name: Fetch the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$BUILD_RUN" -R "$GITHUB_REPOSITORY" -n AliasModeBuilds-linux-x86_64 -D dl
          mkdir -p .ci-browser && unzip -q dl/*.zip -d .ci-browser
          echo "CAMOUFOX_BINARY=$PWD/.ci-browser/aliasmode-bin" >> "$GITHUB_ENV"
      - if: matrix.group == 'spoofing'
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_SHA256: e5ed1bea592a0bf8e43f4564c83ce418cc823d2f605454b806c1744df8215410
        run: |
          mkdir -p .ci-work/font-packs && cd .ci-work/font-packs
          gh release download aliasmode-runtime-156.0.1-beta.36-r4 -R "$GITHUB_REPOSITORY" -p aliasmode-fonts-windows-1.zip
          echo "$PACK_SHA256  aliasmode-fonts-windows-1.zip" | sha256sum -c
          unzip -q aliasmode-fonts-windows-1.zip -d windows && rm aliasmode-fonts-windows-1.zip
          echo "ALIASMODE_FONT_PACKS=$PWD" >> "$GITHUB_ENV"
      - run: xvfb-run -a python3 -m ci.run_patch_guards --group "${{ matrix.group }}" --binary "$CAMOUFOX_BINARY"

  behaviour:
    name: Behaviour ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, artifact: AliasModeBuilds-windows-x86_64}
          - {os: macos-15, artifact: AliasModeBuilds-macos-arm64}
          - {os: macos-15-intel, artifact: AliasModeBuilds-macos-x86_64}
          - {os: ubuntu-24.04, artifact: AliasModeBuilds-linux-x86_64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the build and stock Firefox 159
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" -R "$GITHUB_REPOSITORY" -n "${{ matrix.artifact }}" -D dl
          mkdir -p ours stock
          unzip -q dl/*.zip -d ours
          base=https://archive.mozilla.org/pub/firefox/releases/159.0
          case "$RUNNER_OS" in
            Windows)
              curl -sSfL -o setup.exe "$base/win64/en-US/Firefox%20Setup%20159.0.exe"
              7z x -y -ostock setup.exe > /dev/null
              echo "OURS=$PWD/ours/aliasmode.exe" >> "$GITHUB_ENV"
              echo "STOCK=$PWD/stock/core/firefox.exe" >> "$GITHUB_ENV" ;;
            macOS)
              curl -sSfL -o ff.dmg "$base/mac/en-US/Firefox%20159.0.dmg"
              hdiutil attach -nobrowse -mountpoint /tmp/ffdmg ff.dmg > /dev/null
              cp -R /tmp/ffdmg/Firefox.app stock/
              hdiutil detach /tmp/ffdmg > /dev/null
              arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x86_64)
              gh release download v159.0-beta.43 -R daijro/camoufox -p "camoufox-159.0-beta.43-mac.$arch.zip" -D up
              mkdir -p upstream && unzip -q up/*.zip -d upstream
              xattr -cr ours stock upstream || true
              echo "UPSTREAM=$(ls -d "$PWD"/upstream/*.app)/Contents/MacOS/camoufox" >> "$GITHUB_ENV"
              echo "OURS=$PWD/ours/AliasMode.app/Contents/MacOS/aliasmode" >> "$GITHUB_ENV"
              echo "STOCK=$PWD/stock/Firefox.app/Contents/MacOS/firefox" >> "$GITHUB_ENV" ;;
            Linux)
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libasound2t64 libdbus-glib-1-2 libx11-xcb1 libxtst6 libpci3 openbox
              curl -sSfL "$base/linux-x86_64/en-US/firefox-159.0.tar.xz" | tar -xJ -C stock
              echo "OURS=$PWD/ours/aliasmode" >> "$GITHUB_ENV"
              echo "STOCK=$PWD/stock/firefox/firefox" >> "$GITHUB_ENV" ;;
          esac
      - name: Compare with stock
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'openbox & sleep 1; python3 .github/aliasmode-checks/behaviour.py --ours "$OURS" --stock "$STOCK" --out behaviour.json'
          else
            python3 .github/aliasmode-checks/behaviour.py --ours "$OURS" --stock "$STOCK" ${UPSTREAM:+--upstream "$UPSTREAM"} --out behaviour.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behaviour-${{ matrix.os }}
          path: behaviour.json
          if-no-files-found: warn
